version: '3.8'

services:
  # FastAPI 백엔드 서비스
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: movie-backend
    restart: always
    env_file:
      - .env
    expose:
      - "8000"
    networks:
      - app-network

  # React + Nginx 프론트엔드 서비스
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: movie-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
