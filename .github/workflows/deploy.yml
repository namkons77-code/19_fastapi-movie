name: Deploy to AWS EC2

on:
  push:
    branches:
      - main
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Execute Remote SSH Commands on AWS EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}          # EC2 퍼블릭 IP 또는 도메인
          username: ${{ secrets.EC2_USERNAME }}  # ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}        # .pem 키 내용 전체
          port: 22
          script: |
            cd ~/19_fastapi-movie || cd ~/movie-app || cd ~/*movie*
            chmod +x deploy.sh
            ./deploy.sh
